<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldstore — E-Commerce Storefront</title>
    <meta name="description" content="A full-stack MERN e-commerce storefront by Mark Anthony Estrecho, powered by a custom Express/MongoDB REST API." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>html, body { height: 100%; margin: 0; } #root { min-height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
